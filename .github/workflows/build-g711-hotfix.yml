name: Build G.711 recording hotfix

on:
  workflow_dispatch:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out Bluecherry source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Record pinned dependency SHAs
        shell: bash
        run: |
          git ls-tree HEAD misc/libav misc/ponvif misc/libconfig misc/pugixml > dependency-shas.txt
          cat dependency-shas.txt

      - name: Upload dependency SHA report
        uses: actions/upload-artifact@v4
        with:
          name: bluecherry-dependency-shas
          path: dependency-shas.txt
          if-no-files-found: error
          retention-days: 30

      - name: Check out pinned FFmpeg source
        shell: bash
        run: |
          set -euxo pipefail
          sha=$(git ls-tree HEAD misc/libav | awk '{print $3}')
          test -n "$sha"
          rm -rf misc/libav
          git clone --filter=blob:none --no-checkout https://github.com/FFmpeg/FFmpeg.git misc/libav
          git -C misc/libav fetch --depth 1 origin "$sha"
          git -C misc/libav checkout --detach "$sha"
          test "$(git -C misc/libav rev-parse HEAD)" = "$sha"

      - name: Check out pinned ponvif source
        shell: bash
        run: |
          set -euxo pipefail
          sha=$(git ls-tree HEAD misc/ponvif | awk '{print $3}')
          test -n "$sha"
          rm -rf misc/ponvif
          git clone --filter=blob:none --no-checkout https://github.com/ltoscano/ponvif.git misc/ponvif
          git -C misc/ponvif fetch --depth 1 origin "$sha"
          git -C misc/ponvif checkout --detach "$sha"
          test "$(git -C misc/ponvif rev-parse HEAD)" = "$sha"

      - name: Check out last valid libconfig source
        shell: bash
        run: |
          set -euxo pipefail
          sha=4ac539a2dee761bc161bb13b92e108d799ca91c8
          rm -rf misc/libconfig
          git clone --filter=blob:none --no-checkout https://github.com/hyperrealm/libconfig.git misc/libconfig
          git -C misc/libconfig fetch --depth 1 origin "$sha"
          git -C misc/libconfig checkout --detach "$sha"
          test "$(git -C misc/libconfig rev-parse HEAD)" = "$sha"

      - name: Check out last valid pugixml source
        shell: bash
        run: |
          set -euxo pipefail
          sha=9f92eeba44cdf9df5faae0b03cc5bfb445793348
          rm -rf misc/pugixml
          git clone --filter=blob:none --no-checkout https://github.com/zeux/pugixml.git misc/pugixml
          git -C misc/pugixml fetch --depth 1 origin "$sha"
          git -C misc/pugixml checkout --detach "$sha"
          test "$(git -C misc/pugixml rev-parse HEAD)" = "$sha"

      - name: Apply G.711 recorder hotfix
        run: python3 hotfixes/apply-g711-hotfix.py

      - name: Install package build tooling
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake libtool git build-essential gcc g++ \
            debhelper devscripts equivs fakeroot ccache bison flex texinfo \
            yasm nasm cmake pkg-config libbsd-dev libopencv-dev libudev-dev \
            libva-dev libcurl4-openssl-dev libidn-dev gsoap libgsoap-dev \
            libmariadb-dev rsyslog sudo file

      - name: Generate Debian control file
        run: debian/rules debian/control

      - name: Install declared build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo mk-build-deps --install --remove \
            --tool 'apt-get -y --no-install-recommends' debian/control

      - name: Build Bluecherry package
        shell: bash
        env:
          DEB_BUILD_OPTIONS: nocheck
        run: |
          set -o pipefail
          echo "#define GIT_REVISION \"${GITHUB_SHA} fix/g711-recording-audio\"" > server/version.h
          dpkg-buildpackage -b -uc -us 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bluecherry-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Build small reversible hotfix DEB
        shell: bash
        run: |
          set -euo pipefail
          full_deb=$(find .. -maxdepth 1 -type f -name 'bluecherry_*_amd64.deb' ! -name '*-dbg_*' | head -n1)
          test -n "$full_deb"
          chmod +x hotfixes/build-g711-hotfix-deb.sh
          hotfixes/build-g711-hotfix-deb.sh "$full_deb"

      - name: Upload hotfix artifact
        uses: actions/upload-artifact@v4
        with:
          name: bluecherry-g711-hotfix-ubuntu24.04-amd64
          path: |
            dist/bluecherry-g711-hotfix_3.1.14+g711fix1_amd64.deb
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
